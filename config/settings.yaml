# FreeJobAgent runtime settings. Every backend here is free: a local Ollama
# server, or Google Gemini's free developer tier (OpenAI-compatible endpoint).

llm:
  # "ollama" (local, default) or "gemini" (free tier cloud).
  provider: ollama
  temperature: 0.2
  timeout_seconds: 600               # local models on a laptop CPU can be slow
  max_retries: 2

  ollama:
    base_url: http://localhost:11434
    model: qwen2.5:7b-instruct      # alternatives: llama3.1:8b, mistral:7b
    num_ctx: 8192
    keep_alive: 30m                 # keep the model loaded between jobs (reloading costs seconds)
    scoring_model: ""               # optional smaller model for quick ratings, e.g. qwen2.5:3b-instruct

  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-2.0-flash
    # The key is read from this environment variable; never commit it here.
    api_key_env: GEMINI_API_KEY
    # Free tier is rate limited; stay under it.
    min_seconds_between_calls: 4.5

scrape:
  search_terms: ["python developer", "backend engineer"]
  locations: ["Remote", "Austin, TX"]
  # python-jobspy site names: indeed, linkedin, glassdoor, zip_recruiter, google
  sites: [indeed, linkedin, google]
  results_wanted: 30
  hours_old: 72
  # Direct company career pages scraped with Playwright (optional).
  career_pages: []
  #  - url: https://example.com/careers
  #    company: Example Corp
  #    job_link_selector: "a.job-link"

filters:
  title_blacklist: ["intern"]
  title_keywords_required: []          # empty = no requirement
  company_blacklist: []
  location_allowlist: []               # empty = any location
  location_blacklist: []
  remote_only: false
  min_salary: null                     # annual; null = use target.min_salary from the profile
  drop_if_salary_unknown: false
  description_blacklist: ["security clearance required", "ts/sci"]

ranking:
  min_fit_score: 65                    # below this, recommendation is Skip
  max_jobs_per_run: 30                 # cap on quick AI ratings per search; the rest wait for "Score"
  max_description_chars: 12000         # stored per job
  quick_description_chars: 1500        # quick rating reads only the essentials of a posting
                                       # (requirements, duties); the AI reads every character
                                       # before answering, so this is the biggest speed lever
  prompt_description_chars: 4000       # detailed "Why you fit" reads this much
  explain_top: 5                       # auto-explain only the best few; others have a button
  weights:                             # how the 0-100 score is made up (any numbers; scaled to 100)
    skills: 35                         # AI rating 1-5
    experience: 25                     # AI rating 1-5
    title: 15                          # job title vs. the titles you want (no AI)
    location: 15                       # distance from home vs. your commute (no AI)
    local: 10                          # small employer near home (no AI; profile can switch off)
  prescreen_min_score: 2               # instant keyword check against your profile; jobs
                                       # below it never reach the AI (pasted jobs always do)

parallel:
  search_workers: 4                    # job sites searched at the same time
  llm_workers: 2                       # jobs the AI scores at the same time. Ollama must allow
                                       # it too: the launchers set OLLAMA_NUM_PARALLEL when
                                       # they start Ollama. Extra workers just wait otherwise.

generation:
  # Documents are filled from templates (edit them on the Templates page). The AI makes
  # small edits side by side; each is checked instantly for invented facts.
  parallel: true                       # write resume and cover letter at the same time
  llm_review: false                    # extra slow AI proofread of each document
  critic_max_rounds: 1                 # only used when llm_review is on
  resume:
    detailed_jobs: 3                   # jobs shown with bullet points (most relevant + most recent)
    bullets_per_job: 3                 # most relevant bullets kept per detailed job
    min_bullets: 2                     # never fewer than this for a detailed job
    max_skills: 10                     # skills the job asks for come first
  export_formats: [md, pdf, docx]

paths:
  data_dir: data
  build_dir: build
  candidate_profile: config/candidate_profile.yaml
